<div class="min-h-screen bg-bg-deep">
  <app-navbar></app-navbar>

  <div class="section-container py-10">
    <h1 class="font-display text-3xl font-bold mb-1">Admin Control Center</h1>
    <p class="text-white/50 mb-8">Manage members, plans, trainers, and the class timetable.</p>

    <!-- Nested route tab nav -->
    <div class="flex flex-wrap gap-2 mb-8 border-b border-white/5 pb-3">
      @for (t of tabs; track t.path) {
        <a
          [routerLink]="t.path"
          routerLinkActive="bg-neon-orange text-white"
          [routerLinkActiveOptions]="{ exact: false }"
          class="px-4 py-2 rounded-lg font-display text-sm font-semibold transition-colors text-white/50 hover:text-white">
          {{ t.label }}
        </a>
      }
    </div>

    <!-- Child route renders here: overview / members / plans / trainers / classes -->
    <router-outlet></router-outlet>
  </div>

  <app-footer></app-footer>
  <app-toast></app-toast>
</div>
